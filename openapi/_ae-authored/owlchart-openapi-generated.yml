components:
  schemas:
    GetApiConsoleConsoleidResponse:
      type: object
      properties:
        flow:
          type: array
    GetApiCycleMetricResponse:
      type: object
      properties:
        ok:
          type: boolean
        brand:
          type: object
        name:
          type: string
        formula:
          type: string
        source:
          type: string
        days:
          type: integer
        last:
          type: object
        now:
          type: object
        events:
          type: array
        bands:
          type: array
        t:
          type: array
        price:
          type: array
        lines:
          type: object
    GetApiLogoCoinResponse:
      type: object
      properties:
        image:
          type: string
    GetApiMarketsMarketidResponse:
      type: object
      properties:
        depthCurve:
          type: object
    GetApiMcpMcpidResponse:
      type: object
      properties:
        url:
          type: string
        transport:
          type: string
        access:
          type: string
        tools:
          type: array
        usage:
          type: object
    PostApiOwlVerifyRequest:
      type: object
      properties:
        packet:
          type: string
          description: Packet with its receipt to verify
      required:
      - packet
    GetApiOwlcapCheckResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          type: object
    PostApiOwlviewStateRequest:
      type: object
      properties:
        state:
          type: object
          description: Chart state JSON (drawings, alerts, etc.).
      required:
      - state
    PostApiOwlviewStateResponse:
      type: object
      properties:
        state:
          type: object
    PostApiPatternsTrainerAnswerRequest:
      type: object
      properties:
        token:
          type: string
          description: Authentication token for the trainer session
        answer:
          type: string
          description: One of UP, DOWN, SKIP
      required:
      - token
      - answer
    PostApiPresenceBeatRequest:
      type: object
      properties:
        page:
          type: string
          description: Page path, e.g. "/oi-history.html"
      required:
      - page
    GetApiV1MdOhlcvResponse:
      type: object
      properties:
        sym:
          type: string
        class:
          type: string
        venue:
          type: string
        ticker:
          type: string
        tf:
          type: string
        k:
          type: array
          items:
            type: array
            items:
              type: integer
        meta:
          type: object
          properties:
            price:
              type: number
            chg24h:
              type: number
            source:
              type: string
            delay_ms:
              type: integer
            sessions:
              type: string
            capabilities:
              type: array
              items:
                type: string
            tradingPeriod:
              type:
              - string
              - 'null'
    GetApiV1SymbolsSearchResponse:
      type: object
      properties:
        id:
          type: string
        class:
          type: string
        venue:
          type: string
        ticker:
          type: string
        display:
          type: string
        sessions:
          type: string
        capabilities:
          type: array
          items:
