aid: owlchart

name: OwlChart

image: https://owlchart.com/images/og.png?v=3

description: OwlChart provides live crypto and stock market charts, OHLCV candles, real‑time order‑book data, ETF flows, funding rates, liquidations,
  market‑regime signals and AI‑driven analytics. Users can access symbol search, pattern scanning and a conversational ‘Ask the Owl’ assistant
  without needing an account, with trial access to institutional‑grade data across 34 exchanges and major Wall Street indices.

